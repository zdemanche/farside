# iac-hub stage Web. workflow_dispatch only.
name: ui-deploy

on:
  workflow_dispatch:
    inputs:
      customerName:
        required: true
        type: string
      accountId:
        required: true
        type: string
      run_identifier:
        required: true
        type: string
      initialAdmins:
        required: false
        type: string
      firstOwnerEmail:
        required: false
        type: string
      adoptingProducts:
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate accountId
        env:
          ACCOUNT_ID: ${{ inputs.accountId }}
        run: |
          set -euo pipefail
          if ! [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::accountId must be a 12-digit AWS account id."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @farside/console
      - name: Report that console sync is not wired
        run: |
          set -euo pipefail
          echo "::warning::Console sync to the dedicated account was skipped."
          echo "Skipped: Console sync to the dedicated account was skipped. Reason: dedicated-account deploy is switch-on-later; see docs/e1-s3-remaining.md." >> "$GITHUB_STEP_SUMMARY"

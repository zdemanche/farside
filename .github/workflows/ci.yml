name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-types-tests:
    name: lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Reject paths that differ only by case
        run: |
          files=$(git ls-files | tr 'A-Z' 'a-z' | sort | uniq -d)
          dirs=$(git ls-files | xargs -n1 dirname | sort -u | tr 'A-Z' 'a-z' | sort | uniq -d)
          collisions="$files$dirs"
          if [ -n "$collisions" ]; then
            echo "$collisions"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  repository-dynamodb-local:
    name: repository contract on DynamoDB Local
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports:
          - 8000:8000
    env:
      DYNAMO_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run src/repository.contract.test.ts
        working-directory: backend

  e2e:
    name: console browser tests and formatting
    needs: lint-types-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
        working-directory: console
      - run: npm run e2e -w @farside/console
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: console/dist/playwright/
          retention-days: 7

# Product-dev deploy: empty health route + console shell.
# workflow_dispatch only until the dedicated Farside (or moonaan-dev) account
# and GitHub OIDC role exist. ci.yml owns build and test on push.
name: deploy-dev

on:
  workflow_dispatch:
    inputs:
      customerName:
        description: Tenant slug (default moonaan-dev)
        required: false
        default: moonaan-dev
      accountId:
        description: 12-digit dedicated AWS account id
        required: false
      environment:
        description: Moonaan environment tag
        required: false
        default: dev

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate accountId against the registry
        env:
          CUSTOMER_NAME: ${{ inputs.customerName || 'moonaan-dev' }}
          ACCOUNT_ID: ${{ inputs.accountId || secrets.FARSIDE_DEV_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! [[ "${ACCOUNT_ID:-}" =~ ^[0-9]{12}$ ]]; then
            echo "::error::accountId must be a 12-digit AWS account id."
            exit 1
          fi
          REGISTERED=$(jq -r --arg c "$CUSTOMER_NAME" 'if .productDev.customer == $c then .productDev.accountId else (.customers[$c] // "") end' infra/accounts.json)
          if [ "$REGISTERED" != "$ACCOUNT_ID" ]; then
            echo "::error::accountId is not the registered dedicated account for $CUSTOMER_NAME in infra/accounts.json."
            exit 1
          fi
      - name: Report that apply is not wired
        run: |
          set -euo pipefail
          echo "::warning::pulumi up was not run for the dev account."
          echo "Skipped: pulumi up was not run for the dev account. Reason: AWS OIDC role and Pulumi apply are not wired yet; see docs/e1-s3-remaining.md." >> "$GITHUB_STEP_SUMMARY"

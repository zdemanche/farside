# iac-hub stage Infra. workflow_dispatch only.
name: infra-pulumi_up

on:
  workflow_dispatch:
    inputs:
      customerName:
        required: true
        type: string
      accountId:
        required: true
        type: string
      run_identifier:
        required: true
        type: string
      initialAdmins:
        required: false
        type: string
      firstOwnerEmail:
        required: false
        type: string
      adoptingProducts:
        required: false
        type: string

permissions:
  contents: read

jobs:
  up:
    runs-on: ubuntu-latest
    environment: customer
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate accountId
        env:
          ACCOUNT_ID: ${{ inputs.accountId }}
        run: |
          set -euo pipefail
          if ! [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::accountId must be a 12-digit AWS account id."
            exit 1
          fi
      - name: Report that apply is not wired
        run: |
          set -euo pipefail
          echo "::warning::pulumi up was not run."
          echo "Skipped: pulumi up was not run. Reason: dedicated-account deploy and iac-hub registration are switch-on-later; see docs/e1-s3-remaining.md." >> "$GITHUB_STEP_SUMMARY"

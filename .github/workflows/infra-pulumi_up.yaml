# iac-hub stage Infra. workflow_dispatch only.
name: infra-pulumi_up

on:
  workflow_dispatch:
    inputs:
      customerName:
        required: true
        type: string
      accountId:
        required: true
        type: string
      run_identifier:
        required: true
        type: string
      initialAdmins:
        required: false
        type: string
      firstOwnerEmail:
        required: false
        type: string
      adoptingProducts:
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Skip apply until the dedicated-account integration is switched on
        env:
          CUSTOMER_NAME: ${{ inputs.customerName }}
          ACCOUNT_ID: ${{ inputs.accountId }}
        run: |
          echo "Would pulumi up organization/farside/${CUSTOMER_NAME} in account ${ACCOUNT_ID}."
          echo "Skipping: dedicated-account deploy and iac-hub registration are switch-on-later."
          echo "See docs/e1-s3-remaining.md."
          exit 0

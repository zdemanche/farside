# iac-hub stage Infra. workflow_dispatch only.
name: infra-pulumi_up

on:
  workflow_dispatch:
    inputs:
      customerName:
        required: true
        type: string
      accountId:
        required: true
        type: string
      run_identifier:
        required: true
        type: string
      initialAdmins:
        required: false
        type: string
      firstOwnerEmail:
        required: false
        type: string
      adoptingProducts:
        required: false
        type: string

permissions:
  contents: read

jobs:
  require-main:
    runs-on: ubuntu-latest
    steps:
      - name: Require the main ref
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::This workflow only runs from refs/heads/main; dispatched from $REF."
            echo "Refused: dispatched from $REF; only refs/heads/main may run this workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  up:
    needs: require-main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: customer
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch main
        run: git fetch --depth=1 origin main
      - name: Validate accountId against the registry
        env:
          CUSTOMER_NAME: ${{ inputs.customerName }}
          ACCOUNT_ID: ${{ inputs.accountId }}
        run: |
          set -euo pipefail
          if ! [[ "${ACCOUNT_ID:-}" =~ ^[0-9]{12}$ ]]; then
            echo "::error::accountId must be a 12-digit AWS account id."
            exit 1
          fi
          REGISTERED=$(git show origin/main:infra/accounts.json | jq -r --arg c "$CUSTOMER_NAME" 'if .productDev.customer == $c then .productDev.accountId else (.customers[$c] // "") end')
          if [ "$REGISTERED" != "$ACCOUNT_ID" ]; then
            echo "::error::accountId is not the registered dedicated account for $CUSTOMER_NAME in infra/accounts.json on main."
            exit 1
          fi
      - name: Report that apply is not wired
        run: |
          set -euo pipefail
          echo "::warning::pulumi up was not run."
          echo "Skipped: pulumi up was not run. Reason: dedicated-account deploy and iac-hub registration are switch-on-later; see docs/e1-s3-remaining.md." >> "$GITHUB_STEP_SUMMARY"

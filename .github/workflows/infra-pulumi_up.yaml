# iac-hub stage Infra. workflow_dispatch only.
name: infra-pulumi_up

on:
  workflow_dispatch:
    inputs:
      customerName:
        required: true
        type: string
      accountId:
        required: true
        type: string
      run_identifier:
        required: true
        type: string
      initialAdmins:
        required: false
        type: string
      firstOwnerEmail:
        required: false
        type: string
      adoptingProducts:
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Refuse to apply until iac-hub registration and a dedicated account exist
        env:
          CUSTOMER_NAME: ${{ inputs.customerName }}
          ACCOUNT_ID: ${{ inputs.accountId }}
        run: |
          echo "Would pulumi up organization/farside/${CUSTOMER_NAME} in account ${ACCOUNT_ID}."
          echo "Blocked: farside is not in iac-hub PRODUCTS, and no dedicated account OIDC role is configured."
          echo "See docs/e1-s3-remaining.md (E1-S3-T3, E1-S3-T4)."
          exit 1

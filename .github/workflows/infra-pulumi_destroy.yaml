# iac-hub destroy for the Infra stage. workflow_dispatch only.
name: infra-pulumi_destroy

on:
  workflow_dispatch:
    inputs:
      customerName:
        required: true
        type: string
      accountId:
        required: true
        type: string
      run_identifier:
        required: true
        type: string
      destroy:
        description: Must be true to destroy
        required: false
        type: boolean
        default: false
      confirm:
        description: Type the customer slug to confirm
        required: true
        type: string

permissions:
  contents: read

jobs:
  require-main:
    runs-on: ubuntu-latest
    steps:
      - name: Require the main ref
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::This workflow only runs from refs/heads/main; dispatched from $REF."
            echo "Refused: dispatched from $REF; only refs/heads/main may run this workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  destroy:
    needs: require-main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: customer
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch main
        run: git fetch --depth=1 origin main
      - name: Validate destroy confirmation and accountId
        env:
          CUSTOMER_NAME: ${{ inputs.customerName }}
          ACCOUNT_ID: ${{ inputs.accountId }}
          DESTROY: ${{ inputs.destroy }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$DESTROY" != "true" ]; then
            echo "::error::destroy is not true; nothing destroyed."
            echo "Destroy refused: the destroy input was not true." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$CONFIRM" != "$CUSTOMER_NAME" ]; then
            echo "::error::confirm must equal the customer slug."
            echo "Destroy refused: confirm did not equal the customer slug." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          set -euo pipefail
          if ! [[ "${ACCOUNT_ID:-}" =~ ^[0-9]{12}$ ]]; then
            echo "::error::accountId must be a 12-digit AWS account id."
            exit 1
          fi
          REGISTERED=$(git show origin/main:infra/accounts.json | jq -r --arg c "$CUSTOMER_NAME" 'if .productDev.customer == $c then .productDev.accountId else (.customers[$c] // "") end')
          if [ "$REGISTERED" != "$ACCOUNT_ID" ]; then
            echo "::error::accountId is not the registered dedicated account for $CUSTOMER_NAME in infra/accounts.json on main."
            exit 1
          fi
      - name: Report that destroy is not wired
        run: |
          set -euo pipefail
          echo "::warning::pulumi destroy was not run."
          echo "Skipped: pulumi destroy was not run. Reason: no Farside Pulumi stack has been created yet; see docs/e1-s3-remaining.md." >> "$GITHUB_STEP_SUMMARY"

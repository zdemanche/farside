# iac-hub stage BackendArtifacts. workflow_dispatch only; a push trigger
# would fight the account provisioner (see Moonaan/iac-hub medic contract).
name: backend-publish

on:
  workflow_dispatch:
    inputs:
      customerName:
        required: true
        type: string
      accountId:
        required: true
        type: string
      run_identifier:
        required: true
        type: string
      initialAdmins:
        required: false
        type: string
      firstOwnerEmail:
        required: false
        type: string
      adoptingProducts:
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate accountId
        env:
          ACCOUNT_ID: ${{ inputs.accountId }}
        run: |
          set -euo pipefail
          if ! [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::accountId must be a 12-digit AWS account id."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @farside/backend
      - name: Report that artifact upload is not wired
        run: |
          set -euo pipefail
          echo "::warning::Backend artifact upload was skipped."
          echo "Skipped: Backend artifact upload was skipped. Reason: iac-hub PRODUCTS registration is switch-on-later; see docs/e1-s3-remaining.md." >> "$GITHUB_STEP_SUMMARY"
